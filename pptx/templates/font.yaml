# 字体与字号基准（与 render_ppt.py 常量一一对应，冲突以 render_ppt.py 源码为准）
default_font: "Microsoft YaHei"
fallback_fonts: ["Microsoft YaHei", "PingFang SC", "Arial"]
min_font_size_pt: 14
role_size_range_pt:
  title: [36, 54]
  subtitle: [20, 28]
  body: [14, 24]
  keyword: [14, 24]
contrast_min_normal: 4.5     # 普通文本（<18pt 且非粗体）
contrast_min_large: 3.0      # 大文本（>=18pt 或 bold=true）
text_limits:
  cover_title_max_chars: 20
  page_title_max_chars: 24
  item_max_chars: 25
  items_per_page: [3, 6]     # 每页要点 3~6 条
